    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030108;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }

        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            filter: blur(100px);
            pointer-events: none;
        }

        /* Glassmorphism Card UI */
        .luxury-glass {
            background: rgba(18, 11, 28, 0.65);
            backdrop-filter: blur(36px) saturate(190%);
            -webkit-backdrop-filter: blur(36px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85),
                        0 18px 36px -18px rgba(236, 72, 153, 0.25),
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Input Pin Box */
        .pin-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pin-box:focus-within, .pin-box.active {
            border-color: rgba(244, 114, 182, 0.85);
            background: rgba(244, 114, 182, 0.1);
            box-shadow: 0 0 18px rgba(244, 114, 182, 0.3), inset 0 0 12px rgba(244, 114, 182, 0.15);
            transform: translateY(-1px);
        }

        /* Shimmer Button */
        .btn-modern {
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 50%, #be123c 100%);
            box-shadow: 0 8px 25px -4px rgba(225, 29, 72, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -2px rgba(225, 29, 72, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            filter: brightness(1.1);
        }

        .btn-modern:active {
            transform: translateY(0);
        }

        /* Shake animation for invalid passcode */
        @keyframes shake-modern {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake-modern 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>

    <script>

        let scene, camera, renderer, controls;

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowColor = 'rgba(244, 63, 94, 0.9)';
            ctx.shadowBlur = 16;
            ctx.font = 'bold 32px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        function createHeartTexture(colorHex = '#f43f5e') {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorHex;
            ctx.shadowColor = '#fb7185';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            const x = 32, y = 32;
            ctx.moveTo(x, y + 16);
            ctx.bezierCurveTo(x, y + 12, x - 20, y - 4, x - 20, y - 16);
            ctx.bezierCurveTo(x - 20, y - 24, x - 8, y - 28, x, y - 16);
            ctx.bezierCurveTo(x + 8, y - 28, x + 20, y - 24, x + 20, y - 16);
            ctx.bezierCurveTo(x + 20, y - 4, x, y + 12, x, y + 16);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        function createAccretionDiskTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(256, 256, 60, 256, 256, 250);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.15, 'rgba(244, 63, 94, 0.95)');
            grad.addColorStop(0.4, 'rgba(192, 132, 252, 0.7)');
            grad.addColorStop(0.7, 'rgba(236, 72, 153, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 360; i += 2) {
                const rad = i * Math.PI / 180;
                const len = 120 + Math.random() * 120;
                ctx.strokeStyle = `rgba(255, 220, 240, ${Math.random() * 0.4})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(256 + Math.cos(rad) * 65, 256 + Math.sin(rad) * 65);
                ctx.lineTo(256 + Math.cos(rad) * len, 256 + Math.sin(rad) * len);
                ctx.stroke();
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createBlackHole() {
            blackHoleGroup = new THREE.Group();
            blackHoleGroup.position.set(0, -1, 0);

            const eventHorizonGeo = new THREE.SphereGeometry(3.8, 64, 64);
            const eventHorizonMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eventHorizon = new THREE.Mesh(eventHorizonGeo, eventHorizonMat);
            blackHoleGroup.add(eventHorizon);

            const photonGeo1 = new THREE.RingGeometry(3.82, 4.3, 64);
            const photonMat1 = new THREE.MeshBasicMaterial({
                color: 0xffe4e6,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });
            photonRingMesh1 = new THREE.Mesh(photonGeo1, photonMat1);
            photonRingMesh1.rotation.x = Math.PI / 2;
            blackHoleGroup.add(photonRingMesh1);

            const photonGeo2 = new THREE.RingGeometry(3.82, 4.6, 64);
            const photonMat2 = new THREE.MeshBasicMaterial({
                color: 0xf43f5e,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            photonRingMesh2 = new THREE.Mesh(photonGeo2, photonMat2);
            photonRingMesh2.rotation.x = Math.PI / 6;
            photonRingMesh2.rotation.y = Math.PI / 4;
            blackHoleGroup.add(photonRingMesh2);

            const diskGeo = new THREE.RingGeometry(4.0, 18.0, 64);
            const diskTex = createAccretionDiskTexture();
            const diskMat = new THREE.MeshBasicMaterial({
                map: diskTex,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95,
                blending: THREE.AdditiveBlending
            });
            accretionDiskMesh = new THREE.Mesh(diskGeo, diskMat);
            accretionDiskMesh.rotation.x = Math.PI / 2;
            blackHoleGroup.add(accretionDiskMesh);

            blackHoleGroup.scale.set(0.001, 0.001, 0.001);
            scene.add(blackHoleGroup);
        }

        function initThreeScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030108, 0.0025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
            camera.position.set(0, 32, 85);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 280;
            controls.minDistance = 10;
            controls.maxPolarAngle = Math.PI / 2 + 0.18;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xf43f5e, 3.0, 250);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);

            createBlackHole();

            const deepStarCount = 80000;
            const deepStarGeo = new THREE.BufferGeometry();
            const deepStarPos = new Float32Array(deepStarCount * 3);
            const deepStarColors = new Float32Array(deepStarCount * 3);

            for (let i = 0; i < deepStarCount; i++) {
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 140 + Math.random() * 380;

                deepStarPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                deepStarPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                deepStarPos[i * 3 + 2] = r * Math.cos(phi);

                const starColor = new THREE.Color();
                if (Math.random() > 0.5) {
                    starColor.setHSL(0.9 + Math.random() * 0.1, 0.85, 0.8);
                } else {
                    starColor.setHSL(0.55 + Math.random() * 0.15, 0.8, 0.85);
                }

                deepStarColors[i * 3] = starColor.r;
                deepStarColors[i * 3 + 1] = starColor.g;
                deepStarColors[i * 3 + 2] = starColor.b;
            }

            deepStarGeo.setAttribute('position', new THREE.BufferAttribute(deepStarPos, 3));
            deepStarGeo.setAttribute('color', new THREE.BufferAttribute(deepStarColors, 3));

            const deepStarMat = new THREE.PointsMaterial({
                size: 0.45,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            deepStarfield = new THREE.Points(deepStarGeo, deepStarMat);
            scene.add(deepStarfield);

            const cometCount = 150;
            const cometGeo = new THREE.BufferGeometry();
            shootingStarPositions = new Float32Array(cometCount * 3);
            shootingStarVelocities = [];

            for (let i = 0; i < cometCount; i++) {
                shootingStarPositions[i * 3] = (Math.random() - 0.5) * 300;
                shootingStarPositions[i * 3 + 1] = Math.random() * 150 + 50;
                shootingStarPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;

                shootingStarVelocities.push({
                    x: (Math.random() - 0.5) * 1.5,
                    y: -Math.random() * 2.0 - 1.0,
                    z: (Math.random() - 0.5) * 1.5
                });
            }

            cometGeo.setAttribute('position', new THREE.BufferAttribute(shootingStarPositions, 3));
            const cometMat = new THREE.PointsMaterial({
                size: 1.2,
                color: 0xffe4e6,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            shootingStars = new THREE.Points(cometGeo, cometMat);
            scene.add(shootingStars);

            planetsGroup = new THREE.Group();

            function createPlanetTexture(baseColor, stripeColor) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, 0, 256);
                grad.addColorStop(0, baseColor);
                grad.addColorStop(0.5, stripeColor);
                grad.addColorStop(1, baseColor);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);

                for (let i = 0; i < 20; i++) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.2})`;
                    ctx.fillRect(0, Math.random() * 256, 256, Math.random() * 14 + 4);
                }
                return new THREE.CanvasTexture(canvas);
            }

            const planet1Geo = new THREE.SphereGeometry(7, 32, 32);
            const planet1Mat = new THREE.MeshStandardMaterial({
                map: createPlanetTexture('#fda4af', '#e11d48'),
                roughness: 0.5
            });
            const planet1 = new THREE.Mesh(planet1Geo, planet1Mat);
            planet1.position.set(-75, 25, -60);

            const ringGeo = new THREE.RingGeometry(9.5, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xfbcfe8,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.75
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2.5;
            planet1.add(ring);
            planetsGroup.add(planet1);

            const planet2Geo = new THREE.SphereGeometry(5, 32, 32);
            const planet2Mat = new THREE.MeshStandardMaterial({
                map: createPlanetTexture('#c084fc', '#f43f5e'),
                roughness: 0.4
            });
            const planet2 = new THREE.Mesh(planet2Geo, planet2Mat);
            planet2.position.set(80, -18, -50);
            planetsGroup.add(planet2);

            const planet3Geo = new THREE.SphereGeometry(4, 32, 32);
            const planet3Mat = new THREE.MeshStandardMaterial({
                map: createPlanetTexture('#38bdf8', '#818cf8'),
                roughness: 0.3
            });
            const planet3 = new THREE.Mesh(planet3Geo, planet3Mat);
            planet3.position.set(-50, -30, 50);
            planetsGroup.add(planet3);

            planetsGroup.scale.set(0.001, 0.001, 0.001);
            scene.add(planetsGroup);

            const galaxyCount = 90000;
            const galaxyGeo = new THREE.BufferGeometry();
            galaxyPositionsTarget = new Float32Array(galaxyCount * 3);
            galaxyPositionsScatter = new Float32Array(galaxyCount * 3);
            const galaxyPosCurr = new Float32Array(galaxyCount * 3);
            const galaxyColors = new Float32Array(galaxyCount * 3);

            for (let i = 0; i < galaxyCount; i++) {
                const radius = 5 + Math.pow(Math.random(), 1.1) * 55;
                const branches = 4;
                const spin = radius * 0.22;
                const branchAngle = ((i % branches) * (2 * Math.PI / branches)) + spin;

                const randomX = (Math.random() - 0.5) * (radius * 0.35);
                const randomY = (Math.random() - 0.5) * (radius * 0.25);
                const randomZ = (Math.random() - 0.5) * (radius * 0.35);

                const tx = Math.cos(branchAngle) * radius + randomX;
                const ty = randomY - 1;
                const tz = Math.sin(branchAngle) * radius + randomZ;

                galaxyPositionsTarget[i * 3] = tx;
                galaxyPositionsTarget[i * 3 + 1] = ty;
                galaxyPositionsTarget[i * 3 + 2] = tz;

                const sr = 130 + Math.random() * 220;
                const stheta = Math.random() * Math.PI * 2;
                const sphi = Math.acos(2 * Math.random() - 1);
                galaxyPositionsScatter[i * 3] = sr * Math.sin(sphi) * Math.cos(stheta);
                galaxyPositionsScatter[i * 3 + 1] = sr * Math.sin(sphi) * Math.sin(stheta);
                galaxyPositionsScatter[i * 3 + 2] = sr * Math.cos(sphi);

                galaxyPosCurr[i * 3] = galaxyPositionsScatter[i * 3];
                galaxyPosCurr[i * 3 + 1] = galaxyPositionsScatter[i * 3 + 1];
                galaxyPosCurr[i * 3 + 2] = galaxyPositionsScatter[i * 3 + 2];

                const color = new THREE.Color();
                if (radius < 18) {
                    color.setHSL(0.95 + Math.random() * 0.05, 0.95, 0.85);
                } else {
                    color.setHSL(0.72 + Math.random() * 0.2, 0.85, 0.72);
                }
                galaxyColors[i * 3] = color.r;
                galaxyColors[i * 3 + 1] = color.g;
                galaxyColors[i * 3 + 2] = color.b;
            }

            galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPosCurr, 3));
            galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

            const galaxyMat = new THREE.PointsMaterial({
                size: 0.55,
                vertexColors: true,
                transparent: true,
                opacity: 0.88,
                blending: THREE.AdditiveBlending
            });
            galaxyParticles = new THREE.Points(galaxyGeo, galaxyMat);
            scene.add(galaxyParticles);

            const heartCount = 50000;
            const heartGeo = new THREE.BufferGeometry();
            heartPositionsTarget = new Float32Array(heartCount * 3);
            heartPositionsScatter = new Float32Array(heartCount * 3);
            const heartPosCurr = new Float32Array(heartCount * 3);
            const heartColors = new Float32Array(heartCount * 3);

            for (let i = 0; i < heartCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const scale = 0.92;

                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let hz = (Math.random() - 0.5) * 10;

                hx *= scale;
                hy = hy * scale + 15; 
                hz *= scale;

                hx += (Math.random() - 0.5) * 2.8;
                hy += (Math.random() - 0.5) * 2.8;
                hz += (Math.random() - 0.5) * 2.8;

                heartPositionsTarget[i * 3] = hx;
                heartPositionsTarget[i * 3 + 1] = hy;
                heartPositionsTarget[i * 3 + 2] = hz;

                const sr = 150 + Math.random() * 200;
                const stheta = Math.random() * Math.PI * 2;
                const sphi = Math.acos(2 * Math.random() - 1);
                heartPositionsScatter[i * 3] = sr * Math.sin(sphi) * Math.cos(stheta);
                heartPositionsScatter[i * 3 + 1] = sr * Math.sin(sphi) * Math.sin(stheta);
                heartPositionsScatter[i * 3 + 2] = sr * Math.cos(sphi);

                heartPosCurr[i * 3] = heartPositionsScatter[i * 3];
                heartPosCurr[i * 3 + 1] = heartPositionsScatter[i * 3 + 1];
                heartPosCurr[i * 3 + 2] = heartPositionsScatter[i * 3 + 2];

                const color = new THREE.Color();
                color.setHSL(0.92 + Math.random() * 0.08, 0.95, 0.78);
                heartColors[i * 3] = color.r;
                heartColors[i * 3 + 1] = color.g;
                heartColors[i * 3 + 2] = color.b;
            }

            heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPosCurr, 3));
            heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

            const heartMat = new THREE.PointsMaterial({
                size: 0.65,
                vertexColors: true,
                transparent: true,
                opacity: 0.92,
                blending: THREE.AdditiveBlending
            });
            heartParticles = new THREE.Points(heartGeo, heartMat);
            scene.add(heartParticles);

            floatingElementsGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous';

            // Load animated GIF stickers using THREE.TextureLoader
            gifStickerUrls.forEach((url, idx) => {
                textureLoader.load(url, (tex) => {
                    tex.generateMipmaps = false;
                    tex.minFilter = THREE.LinearFilter;
                    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
                    gifSpriteMaterials.push(mat);
                    const sprite = new THREE.Sprite(mat);
                    sprite.scale.set(8.5, 8.5, 1);
                    const angle = (idx / gifStickerUrls.length) * Math.PI * 2;
                    const radius = 24 + (idx % 3) * 6;
                    sprite.position.set(Math.cos(angle) * radius, (idx % 4) * 6 - 6, Math.sin(angle) * radius);
                    floatingElementsGroup.add(sprite);
                }, undefined, (err) => {
                    console.log('GIF load fallback', err);
                });
            });

            floatingTexts.forEach((text, idx) => {
                const tex = createTextTexture(text);
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.92 });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(18, 4.5, 1);

                const angle = (idx / floatingTexts.length) * Math.PI * 2 + (idx * 0.1);
                const radius = 20 + (idx % 4) * 9;
                const height = ((idx % 7) - 3) * 5;
                sprite.position.set(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
                floatingElementsGroup.add(sprite);
            });

            const heartTexPink = createHeartTexture('#f43f5e');
            const heartTexWhite = createHeartTexture('#ffffff');
            const heartTexViolet = createHeartTexture('#c084fc');

            for (let i = 0; i < 85; i++) {
                const tex = (i % 3 === 0) ? heartTexWhite : (i % 3 === 1) ? heartTexViolet : heartTexPink;
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85 });
                const sprite = new THREE.Sprite(mat);
                const size = 2.5 + Math.random() * 3.5;
                sprite.scale.set(size, size, 1);
                
                const angle = Math.random() * Math.PI * 2;
                const r = 12 + Math.random() * 45;
                const h = (Math.random() - 0.5) * 35;
                sprite.position.set(Math.cos(angle) * r, h, Math.sin(angle) * r);
                floatingElementsGroup.add(sprite);
            }

            floatingElementsGroup.scale.set(0.001, 0.001, 0.001);
            scene.add(floatingElementsGroup);
        }

        function setupPinInput() {
            let pinValues = ["", "", "", "", "", ""];

            function updatePinUI() {
                const currentVal = passcodeHidden.value.replace(/\D/g, '').slice(0, 6);
                pinValues = currentVal.split("");
                while(pinValues.length < 6) pinValues.push("");

                pinBoxes.forEach((box, i) => {
                    box.textContent = pinValues[i] || "";
                    if (i === currentVal.length && i < 6) {
                        box.classList.add('active');
                    } else {
                        box.classList.remove('active');
                    }
                });
            }

            passcodeHidden.addEventListener('input', (e) => {
                const val = e.target.value.replace(/\D/g, '').slice(0, 6);
                e.target.value = val;
                updatePinUI();
                errorMsg.classList.add('opacity-0');

                if (val.length === 6) {
                    verifyPasscode(val);
                }
            });

            passcodeHidden.addEventListener('focus', () => {
                updatePinUI();
            });

            passcodeHidden.addEventListener('blur', () => {
                pinBoxes.forEach(box => box.classList.remove('active'));
            });

            submitBtn.addEventListener('click', () => {
                const entered = passcodeHidden.value.trim();
                verifyPasscode(entered);
            });

            setTimeout(() => {
                passcodeHidden.focus();
                updatePinUI();
            }, 300);
        }

        function verifyPasscode(enteredCode) {
            if (enteredCode === CORRECT_PASSCODE) {
                uiOverlay.style.transform = 'scale(0.9) translateY(-30px)';
                uiOverlay.style.opacity = '0';
                uiOverlay.style.pointerEvents = 'none';

                setTimeout(() => {
                    uiOverlay.style.display = 'none';
                    interactiveHint.classList.remove('opacity-0', 'pointer-events-none');
                    setTimeout(() => interactiveHint.classList.add('opacity-0'), 6000);
                }, 700);

                isAssembling = true;
            } else {
                const card = uiOverlay.querySelector('.luxury-glass');
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                errorMsg.classList.remove('opacity-0');
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            if (controls) controls.update();

            if (deepStarfield) deepStarfield.rotation.y = time * 0.018;
            if (planetsGroup) planetsGroup.rotation.y = time * 0.025;

            if (shootingStars) {
                const pos = shootingStars.geometry.attributes.position.array;
                for (let i = 0; i < 150; i++) {
                    pos[i * 3] += shootingStarVelocities[i].x;
                    pos[i * 3 + 1] += shootingStarVelocities[i].y;
                    pos[i * 3 + 2] += shootingStarVelocities[i].z;

                    if (pos[i * 3 + 1] < -100) {
                        pos[i * 3] = (Math.random() - 0.5) * 300;
                        pos[i * 3 + 1] = Math.random() * 100 + 100;
                        pos[i * 3 + 2] = (Math.random() - 0.5) * 300;
                    }
                }
                shootingStars.geometry.attributes.position.needsUpdate = true;
            }

            if (blackHoleGroup) {
                accretionDiskMesh.rotation.z = time * 0.4;
                photonRingMesh1.rotation.z = -time * 0.25;
                photonRingMesh2.rotation.z = time * 0.3;
            }

            if (floatingElementsGroup) {
                floatingElementsGroup.rotation.y = time * 0.1;
            }

            if (isAssembling) {
                assembleProgress = Math.min(assembleProgress + 0.015, 1.0);
                const ease = 1 - Math.pow(1 - assembleProgress, 3);

                const galPos = galaxyParticles.geometry.attributes.position.array;
                for (let i = 0; i < galaxyPositionsTarget.length; i++) {
                    galPos[i] = THREE.MathUtils.lerp(galaxyPositionsScatter[i], galaxyPositionsTarget[i], ease);
                }
                galaxyParticles.geometry.attributes.position.needsUpdate = true;
                galaxyParticles.rotation.y = time * 0.06;

                const heartPos = heartParticles.geometry.attributes.position.array;
                for (let i = 0; i < heartPositionsTarget.length; i++) {
                    heartPos[i] = THREE.MathUtils.lerp(heartPositionsScatter[i], heartPositionsTarget[i], ease);
                }
                heartParticles.geometry.attributes.position.needsUpdate = true;
                heartParticles.rotation.y = Math.sin(time * 0.5) * 0.12;

                const scaleVal = THREE.MathUtils.lerp(0.001, 1.0, ease);
                blackHoleGroup.scale.set(scaleVal, scaleVal, scaleVal);
                planetsGroup.scale.set(scaleVal, scaleVal, scaleVal);
                floatingElementsGroup.scale.set(scaleVal, scaleVal, scaleVal);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('load', () => {
            initThreeScene();
            setupPinInput();
            animate();
        });
    </script>
</body>
